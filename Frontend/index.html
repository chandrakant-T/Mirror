<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mirror — Compile 40+ Languages Instantly in Your Browser</title>
    <meta
      name="description"
      content="Mirror is a free browser-based code compiler supporting 40+ languages including C, C++, Java, Python, Go, Rust, and more. No setup, no installs — write, run, and share code instantly."
    />
    <meta name="theme-color" content="#0a0a0f" />

    <!-- Open Graph (Facebook, Discord, LinkedIn, WhatsApp previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mirror" />
    <meta
      property="og:title"
      content="Mirror — Compile 40+ Languages Instantly in Your Browser"
    />
    <meta
      property="og:description"
      content="A free browser-based compiler for 40+ languages. No setup, no installs — chill and code."
    />
    <meta property="og:url" content="https://trymirror.dev/" />
    <meta property="og:image" content="https://trymirror.dev/og-image.png" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Mirror — Compile 40+ Languages Instantly in Your Browser"
    />
    <meta
      name="twitter:description"
      content="A free browser-based compiler for 40+ languages. No setup, no installs — chill and code."
    />
    <meta name="twitter:image" content="https://trymirror.dev/og-image.png" />

    <!-- Canonical URL (avoids duplicate-content confusion with the old Vercel URL) -->
    <link rel="canonical" href="https://trymirror.dev/" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Mirror",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any (Web-based)",
        "description": "A free browser-based code compiler supporting 40+ programming languages.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
